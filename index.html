<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<title>Jarvis</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b14;color:#d6f4ff;font-family:-apple-system,Helvetica,sans-serif;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #12384d}
h1{margin:0;font-size:18px;letter-spacing:6px;color:#4fd8ff}
.hb button{background:none;border:1px solid #12384d;color:#4fd8ff;border-radius:8px;padding:6px 10px;margin-left:6px;font-size:13px}
details{padding:0 16px;border-bottom:1px solid #12384d}
summary{padding:10px 0;color:#7aa7b8;font-size:14px}
details input{width:100%;padding:10px;margin:0 0 8px;border-radius:8px;border:1px solid #12384d;background:#0a1624;color:#d6f4ff;font-size:16px}
details button{margin:0 6px 12px 0;padding:10px 14px;border-radius:8px;border:0;background:#4fd8ff;color:#05202b;font-weight:600}
details button.alt{background:none;border:1px solid #4fd8ff;color:#4fd8ff;font-weight:400}
#log{flex:1;overflow-y:auto;padding:16px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;margin:0 0 10px;line-height:1.4;white-space:pre-wrap}
.me{background:#12384d;margin-left:auto}
.ai{background:#0a1d2e;border:1px solid #12384d}
.sys{color:#ff9a9a;font-size:14px}
.note{color:#7aa7b8;font-size:14px}
footer{display:flex;gap:8px;align-items:center;padding:10px 12px}
#txt{flex:1;padding:12px;border-radius:22px;border:1px solid #12384d;background:#0a1624;color:#d6f4ff;font-size:16px}
#send{padding:12px 16px;border-radius:22px;border:0;background:#4fd8ff;color:#05202b;font-weight:600}
#mic{width:52px;height:52px;border-radius:50%;border:2px solid #4fd8ff;background:#0a1624;font-size:22px}
#mic.on{background:#4fd8ff;box-shadow:0 0 18px #4fd8ff}
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <div class="hb"><button id="voice">🔊 Voce</button><button id="clear">Pulisci</button></div>
</header>
<details id="settings">
  <summary>⚙️ Impostazioni</summary>
  <input id="key" type="password" placeholder="Chiave API Gemini">
  <input id="model" type="text" placeholder="Modello">
  <input id="name" type="text" placeholder="Come vuoi essere chiamata?">
  <input id="vname" type="text" placeholder="Voce (es. Luca)">
  <button id="save">Salva</button>
  <button id="vlist" class="alt">Voci disponibili</button>
  <button id="mshow" class="alt">Vedi memoria</button>
  <button id="mclear" class="alt">Cancella memoria</button>
</details>
<div id="log"></div>
<footer>
  <button id="mic">🎤</button>
  <input id="txt" type="text" placeholder="Scrivi o tocca il microfono">
  <button id="send">Invia</button>
</footer>
<script>
const $=id=>document.getElementById(id);
const DEF='gemini-3.5-flash-lite';
const BASE="Sei Jarvis, assistente personale e secondo cervello dell'utente. Tono elegante, efficiente, caldo e leggermente ironico. Rispondi sempre in italiano, in modo breve e chiaro (massimo 3-4 frasi, salvo richieste diverse), senza elenchi, grassetti o markdown, perché le risposte vengono lette ad alta voce. Aiuti a organizzare idee, priorità, progetti e decisioni. Se una richiesta è vaga, fai una sola domanda di chiarimento. Se non sai qualcosa, dillo senza inventare. Ogni messaggio dell'utente inizia con [Adesso: data e ora]: è l'ora reale, usala per rispondere a domande su data e ora senza dire che non puoi saperle. Quando l'utente ti chiede di ricordare qualcosa, conferma a voce e aggiungi alla fine della risposta una riga esattamente in questa forma: [[RICORDA: frase breve e autosufficiente]].";
const store={
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}
};
let history=[], voiceOn=true, listening=false, rec=null, mem=[];
try{mem=JSON.parse(store.get('jv_mem')||'[]')}catch(e){mem=[]}
$('key').value=store.get('jv_key')||'';
$('model').value=store.get('jv_model')||DEF;
$('name').value=store.get('jv_name')||'';
$('vname').value=store.get('jv_voice')||'Luca';
if(!store.get('jv_key')) $('settings').open=true;

function add(cls,text){
  const d=document.createElement('div');
  d.className='msg '+cls; d.textContent=text;
  $('log').appendChild(d); $('log').scrollTop=$('log').scrollHeight;
  return d;
}
function buildSystem(){
  let s=BASE;
  const n=store.get('jv_name');
  if(n) s+=" L'utente si chiama "+n+".";
  if(mem.length) s+=" Cose che l'utente ti ha chiesto di ricordare: "+mem.join(' | ')+".";
  return s;
}
function unlock(){
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);
  }
}
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('it'));
  const want=(store.get('jv_voice')||'Luca').toLowerCase();
  return vs.find(v=>v.name.toLowerCase().includes(want))||vs.find(v=>/luca|cosimo|diego/i.test(v.name))||vs[0]||null;
}
function speak(t){
  if(!voiceOn||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[*_#`]/g,''));
  u.lang='it-IT'; u.pitch=0.9;
  const v=pickVoice(); if(v)u.voice=v;
  speechSynthesis.speak(u);
}
async function send(text){
  text=(text||'').trim(); if(!text)return;
  const key=(store.get('jv_key')||'').replace(/[^A-Za-z0-9_.-]/g,'');
  if(!key){$('settings').open=true;add('sys','Inserisci prima la chiave API nelle impostazioni.');return;}
  add('me',text);
  history.push({role:'user',parts:[{text}]});
  const wait=add('ai','…');
  let h=history.slice(-20);
  while(h.length&&h[0].role!=='user')h.shift();
  const now=new Date().toLocaleString('it-IT',{dateStyle:'full',timeStyle:'short'});
  const contents=h.map((m,i)=>i===h.length-1?{role:m.role,parts:[{text:'[Adesso: '+now+'] '+m.parts[0].text}]}:m);
  const model=(store.get('jv_model')||DEF).trim();
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({systemInstruction:{parts:[{text:buildSystem()}]},contents:contents})
    });
    const d=await r.json();
    if(!r.ok) throw new Error((d.error&&d.error.message)||('Errore '+r.status));
    const parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
    let out=parts.map(p=>p.text||'').join('').trim();
    const found=[];
    out=out.replace(/\[\[RICORDA:\s*([\s\S]*?)\]\]/g,(m,t)=>{t=t.trim();if(t)found.push(t);return '';}).trim();
    if(found.length){mem=mem.concat(found).slice(-100);store.set('jv_mem',JSON.stringify(mem));}
    if(!out)out=found.length?'Fatto.':'(nessuna risposta)';
    history.push({role:'model',parts:[{text:out}]});
    wait.textContent=out; speak(out);
    if(found.length)add('note','🧠 Memorizzato: '+found.join(' | '));
  }catch(e){
    wait.textContent='Errore: '+e.message+' (modello: '+model+')'; wait.className='msg sys'; history.pop();
  }
  $('log').scrollTop=$('log').scrollHeight;
}
$('send').onclick=()=>{unlock();const t=$('txt').value;$('txt').value='';send(t);};
$('txt').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('send').click();}};
$('save').onclick=()=>{
  store.set('jv_key',$('key').value.replace(/[^A-Za-z0-9_.-]/g,''));
  store.set('jv_model',$('model').value.trim()||DEF);
  store.set('jv_name',$('name').value.trim());
  store.set('jv_voice',$('vname').value.trim()||'Luca');
  $('settings').open=false; add('note','Salvato ✅');
};
$('vlist').onclick=()=>{
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('it')).map(v=>v.name);
  add('note','Voci italiane: '+(vs.join(', ')||'nessuna trovata'));
};
$('mshow').onclick=()=>add('note',mem.length?'Memoria: '+mem.join(' | '):'Memoria vuota.');
$('mclear').onclick=()=>{mem=[];store.set('jv_mem','[]');add('note','Memoria cancellata.');};
$('clear').onclick=()=>{history=[];$('log').innerHTML='';speechSynthesis.cancel();};
$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').textContent=voiceOn?'🔊 Voce':'🔇 Voce';if(!voiceOn)speechSynthesis.cancel();};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{
  unlock();
  if(!SR){add('sys','Riconoscimento vocale non supportato: apri Jarvis in Safari.');return;}
  if(listening){rec.stop();return;}
  speechSynthesis.cancel();
  rec=new SR(); rec.lang='it-IT'; rec.interimResults=false;
  rec.onstart=()=>{listening=true;$('mic').classList.add('on');};
  rec.onend=()=>{listening=false;$('mic').classList.remove('on');};
  rec.onerror=e=>add('sys','Microfono: '+e.error);
  rec.onresult=e=>send(e.results[0][0].transcript);
  rec.start();
};
</script>
</body>
</html>
