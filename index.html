<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<title>Jarvis</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b14;color:#d6f4ff;font-family:-apple-system,Helvetica,sans-serif;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #12384d}
h1{margin:0;font-size:18px;letter-spacing:6px;color:#4fd8ff}
.hb button{background:none;border:1px solid #12384d;color:#4fd8ff;border-radius:8px;padding:6px 10px;margin-left:6px;font-size:13px}
details{padding:0 16px;border-bottom:1px solid #12384d}
summary{padding:10px 0;color:#7aa7b8;font-size:14px}
details input{width:100%;padding:10px;margin:0 0 8px;border-radius:8px;border:1px solid #12384d;background:#0a1624;color:#d6f4ff;font-size:16px}
details button{margin-bottom:12px;padding:10px 16px;border-radius:8px;border:0;background:#4fd8ff;color:#05202b;font-weight:600}
#log{flex:1;overflow-y:auto;padding:16px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;margin:0 0 10px;line-height:1.4;white-space:pre-wrap}
.me{background:#12384d;margin-left:auto}
.ai{background:#0a1d2e;border:1px solid #12384d}
.sys{color:#ff9a9a;font-size:14px}
footer{display:flex;gap:8px;align-items:center;padding:10px 12px}
#txt{flex:1;padding:12px;border-radius:22px;border:1px solid #12384d;background:#0a1624;color:#d6f4ff;font-size:16px}
#send{padding:12px 16px;border-radius:22px;border:0;background:#4fd8ff;color:#05202b;font-weight:600}
#mic{width:52px;height:52px;border-radius:50%;border:2px solid #4fd8ff;background:#0a1624;font-size:22px}
#mic.on{background:#4fd8ff;box-shadow:0 0 18px #4fd8ff}
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <div class="hb"><button id="voice">🔊 Voce</button><button id="clear">Pulisci</button></div>
</header>
<details id="settings">
  <summary>⚙️ Impostazioni</summary>
  <input id="key" type="password" placeholder="Incolla qui la chiave API Gemini">
  <input id="model" type="text" placeholder="Modello">
  <button id="save">Salva</button>
</details>
<div id="log"></div>
<footer>
  <button id="mic">🎤</button>
  <input id="txt" type="text" placeholder="Scrivi o tocca il microfono">
  <button id="send">Invia</button>
</footer>
<script>
const $=id=>document.getElementById(id);
const SYSTEM="Sei Jarvis, un assistente personale elegante, efficiente e leggermente ironico. Rispondi sempre in italiano, in modo breve e chiaro (massimo 3-4 frasi, salvo richieste diverse). Non usare elenchi, grassetti o markdown: le tue risposte vengono lette ad alta voce.";
const store={
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}
};
let history=[], voiceOn=true, listening=false, rec=null;
$('key').value=store.get('jv_key')||'';
$('model').value=store.get('jv_model')||'gemini-3.8-flash';
if(!store.get('jv_key')) $('settings').open=true;

function add(cls,text){
  const d=document.createElement('div');
  d.className='msg '+cls; d.textContent=text;
  $('log').appendChild(d); $('log').scrollTop=$('log').scrollHeight;
  return d;
}
function unlock(){
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);
  }
}
function speak(t){
  if(!voiceOn||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[*_#`]/g,''));
  u.lang='it-IT';
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('it'));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
async function send(text){
  text=(text||'').trim(); if(!text)return;
  const key=store.get('jv_key');
  if(!key){$('settings').open=true;add('sys','Inserisci prima la chiave API nelle impostazioni.');return;}
  add('me',text);
  history.push({role:'user',parts:[{text}]});
  const wait=add('ai','…');
  let h=history.slice(-20);
  while(h.length&&h[0].role!=='user')h.shift();
  try{
    const model=store.get('jv_model')||'gemini-3.8-flash';
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({systemInstruction:{parts:[{text:SYSTEM}]},contents:h})
    });
    const d=await r.json();
    if(!r.ok) throw new Error((d.error&&d.error.message)||('Errore '+r.status));
    const parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
    const out=parts.map(p=>p.text||'').join('').trim()||'(nessuna risposta)';
    history.push({role:'model',parts:[{text:out}]});
    wait.textContent=out; speak(out);
  }catch(e){
    wait.textContent='Errore: '+e.message; wait.className='msg sys'; history.pop();
  }
  $('log').scrollTop=$('log').scrollHeight;
}
$('send').onclick=()=>{unlock();const t=$('txt').value;$('txt').value='';send(t);};
$('txt').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('send').click();}};
$('save').onclick=()=>{
  store.set('jv_key',$('key').value.trim());
  store.set('jv_model',$('model').value.trim()||'gemini-3.8-flash');
  $('settings').open=false; add('sys','Salvato ✅');
};
$('clear').onclick=()=>{history=[];$('log').innerHTML='';speechSynthesis.cancel();};
$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').textContent=voiceOn?'🔊 Voce':'🔇 Voce';if(!voiceOn)speechSynthesis.cancel();};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{
  unlock();
  if(!SR){add('sys','Riconoscimento vocale non supportato: apri Jarvis in Safari.');return;}
  if(listening){rec.stop();return;}
  speechSynthesis.cancel();
  rec=new SR(
